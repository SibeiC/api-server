---
name: Java CI with Maven

on:
  push:
    branches: ["master"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["master"]
  workflow_dispatch:
# Least privilege by default; jobs opt into more only where they need it.
permissions:
  contents: read

jobs:
  ci-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      app-version: ${{ steps.extract-version.outputs.app-version }}

    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout src code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-


      - name: Extract version (strip leading v of tag)
        id: extract-version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          RAW_VERSION=${GITHUB_REF#refs/tags/}
          APP_VERSION=${RAW_VERSION#v}
          mvn -B versions:set -DnewVersion=${APP_VERSION}
          echo "app-version=${APP_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker for Testcontainers
        uses: docker/setup-docker-action@v5

      - name: Build and Verify
        run: mvn -B -P ci -DskipTests=false clean verify

      - name: Publish Test Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: |
            target/surefire-reports/*.xml
            target/failsafe-reports/*.xml

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          name: api-server-jar
          path: target/api-server.jar

  docker:
    runs-on: ubuntu-latest
    needs: ci-test
    timeout-minutes: 20
    # Only this job touches GHCR (login + image push), so it is the only one granted packages:write.
    permissions:
      contents: read
      packages: write
    # 🚨 only run if this workflow was triggered by a tag push (release)
    # workflow_dispatch reruns skip the build and re-converge the box against :latest.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout files for Docker creation
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Dockerfile
            entrypoint.sh
          sparse-checkout-cone-mode: false

      - name: Download JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: api-server-jar
          path: app/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up repo info
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ needs.ci-test.outputs.app-version || '0.0.1-SNAPSHOT' }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.REPO }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Runs after a successful image build on tag pushes, AND on manual workflow_dispatch
    # (which skips `docker` and re-converges the box against whatever image :latest points at).
    # Explicitly excluded from PR builds and master-branch pushes so we don't deploy on every commit.
    needs: [docker]
    if: >-
      ${{ always()
          && needs.docker.result != 'failure'
          && needs.docker.result != 'cancelled'
          && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ansible payload
        uses: actions/checkout@v7
        with:
          # Keep this list in sync with what the playbook reads on the server.
          sparse-checkout: |
            playbook.yml
            templates
            hosts.ini
            requirements.yml
            docker-compose.yml
          sparse-checkout-cone-mode: false

      # Plain OpenSSH from the runner image rather than appleboy/scp-action + ssh-action: those
      # download a drone-scp/drone-ssh binary from github.com/releases on every run, and that CDN
      # path 504'd for the v1.11.0 deploy while the rest of GitHub was up.
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          # No host key pinned (same as the appleboy actions, which had no fingerprint set).
          cat > ~/.ssh/config <<'EOF'
          Host deploy-target
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 30
            ServerAliveInterval 30
          EOF

      - name: Ship ansible payload to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -o HostName="$SERVER_HOST" -l "$SERVER_USER" deploy-target \
            'rm -rf ~/api-server-deploy && mkdir -p ~/api-server-deploy'
          # `templates` is a directory; -r preserves its subpaths on the remote.
          scp -r -o HostName="$SERVER_HOST" -o User="$SERVER_USER" \
            playbook.yml templates hosts.ini requirements.yml docker-compose.yml \
            deploy-target:api-server-deploy/

      - name: Run ansible + docker compose on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GHCR_PAT_RO: ${{ secrets.GHCR_PAT_RO }}
          # GHCR_USER must match the account that owns GHCR_PAT_RO — use the repo owner (stable)
          # rather than github.actor (which varies by who triggers workflow_dispatch / tag push).
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          SSH=(ssh -o HostName="$SERVER_HOST" -l "$SERVER_USER" deploy-target)
          # Secrets travel over ssh stdin only — never in argv on either side.
          {
            printf 'doppler_token: "%s"\n' "${DOPPLER_TOKEN//\"/\\\"}"
            printf 'ghcr_user: "%s"\n' "${GHCR_USER//\"/\\\"}"
            printf 'ghcr_pat_ro: "%s"\n' "${GHCR_PAT_RO//\"/\\\"}"
            printf 'docker_deploy: true\n'
          } | "${SSH[@]}" 'umask 077 && cat > ~/api-server-deploy/.ansible-secrets.yml'
          # The brace group is parsed whole before it runs, and its stdin is /dev/null, so nothing
          # inside (ansible-galaxy, ansible-playbook) can swallow the rest of the piped script.
          "${SSH[@]}" 'bash -s' <<'REMOTE'
          {
            set -euo pipefail
            cd ~/api-server-deploy
            SECRETS_FILE="$PWD/.ansible-secrets.yml"
            trap 'shred -u "$SECRETS_FILE" 2>/dev/null || rm -f "$SECRETS_FILE"' EXIT
            ansible-galaxy collection install -r requirements.yml
            ansible-playbook -i hosts.ini -l local playbook.yml -e "@$SECRETS_FILE"
          } </dev/null
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
